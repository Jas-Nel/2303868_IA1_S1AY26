<!DOCTYPE html>
<html>

<head>
<title>Task 2 - JavaScript</title>
</head>

<body>

<h1 id="message">JavaScript Programming is Easy</h1>

<script>
        
let firstName = prompt("Enter your first name:");    
let messageColour = prompt("Enter the colour of the message:");      
let messageSize = prompt("Enter the font size (e.g. 30px):");

        
document.getElementById("message").innerHTML =
firstName + "says: JavaScript Programming is Easy";

       
document.getElementById("message").style.color = messageColour;    
document.getElementById("message").style.fontSize = messageSize;
</script>

</body>
</html>
